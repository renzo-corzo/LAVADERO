<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión — Lavadero</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #0f2f38;
        background: linear-gradient(135deg, #0fb5b0, #1f7ae0);
      }
      .card {
        background: rgba(255, 255, 255, .95); border-radius: 20px;
        padding: 32px 28px; max-width: 320px; margin: 20px;
        box-shadow: 0 18px 50px -20px rgba(15, 47, 56, .5);
      }
      h1 { font-size: 20px; margin: 8px 0 6px; }
      p { color: #5c7883; font-size: 14px; line-height: 1.5; margin: 0 0 18px; }
      button {
        border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; color: #fff;
        background: linear-gradient(135deg, #0fb5b0, #1f7ae0); font-size: 14px;
      }
      .drop { font-size: 40px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="drop">💧</div>
      <h1>Sin conexión</h1>
      <p>No pudimos conectar con el servidor. Revisá tu internet y reintentá.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
